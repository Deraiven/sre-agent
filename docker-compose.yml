services:
  postgres:
    image: postgres:16-alpine
    container_name: sre-agent-postgres
    environment:
      POSTGRES_DB: sre_agent
      POSTGRES_USER: sre_agent
      POSTGRES_PASSWORD: sre_agent
    ports:
      - "5432:5432"
    volumes:
      - sre_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre_agent -d sre_agent"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sre_agent_postgres_data:

services:
  - name: payment-api
    owner: payment-platform
    github_repo: org/payment-api
    production_branch: master
    newrelic_entity_guid: REPLACE_WITH_NEW_RELIC_ENTITY_GUID
    kubernetes:
      cluster: production
      namespace: production
      workload_kind: Deployment
      workload_name: payment-api
      label_selector: app=payment-api
    slo:
      availability_target: 99.9
      latency_p95_ms: 500
    newrelic_signals:
      p95_latency: "Transaction percentile or APM golden metrics query"
      p99_latency: "Transaction percentile or APM golden metrics query"
      error_rate: "APM error rate or Transaction error percentage"
      throughput: "APM throughput or Transaction rate"
    prometheus_resources:
      cpu_usage: 'sum(rate(container_cpu_usage_seconds_total{namespace="production", pod=~"payment-api-.*"}[5m]))'
      memory_usage: 'sum(container_memory_working_set_bytes{namespace="production", pod=~"payment-api-.*"})'
      cpu_throttling: 'sum(rate(container_cpu_cfs_throttled_seconds_total{namespace="production", pod=~"payment-api-.*"}[5m]))'
      network_receive: 'sum(rate(container_network_receive_bytes_total{namespace="production", pod=~"payment-api-.*"}[5m]))'
      network_transmit: 'sum(rate(container_network_transmit_bytes_total{namespace="production", pod=~"payment-api-.*"}[5m]))'
    dependencies:
      downstream:
        - inventory-api
        - postgres-payment
        - redis-checkout
      upstream:
        - checkout-web
    runbooks:
      - title: Payment API high latency
        url: https://example.com/runbooks/payment-api-high-latency
      - title: Payment API rollback
        url: https://example.com/runbooks/payment-api-rollback

  - name: inventory-api
    owner: inventory-platform
    github_repo: org/inventory-api
    production_branch: master
    newrelic_entity_guid: REPLACE_WITH_NEW_RELIC_ENTITY_GUID
    kubernetes:
      cluster: production
      namespace: production
      workload_kind: Deployment
      workload_name: inventory-api
      label_selector: app=inventory-api
    slo:
      availability_target: 99.9
      latency_p95_ms: 700
    newrelic_signals:
      p95_latency: "Transaction percentile or APM golden metrics query"
      p99_latency: "Transaction percentile or APM golden metrics query"
      error_rate: "APM error rate or Transaction error percentage"
      throughput: "APM throughput or Transaction rate"
    prometheus_resources:
      cpu_usage: 'sum(rate(container_cpu_usage_seconds_total{namespace="production", pod=~"inventory-api-.*"}[5m]))'
      memory_usage: 'sum(container_memory_working_set_bytes{namespace="production", pod=~"inventory-api-.*"})'
      cpu_throttling: 'sum(rate(container_cpu_cfs_throttled_seconds_total{namespace="production", pod=~"inventory-api-.*"}[5m]))'
    dependencies:
      downstream:
        - postgres-inventory
      upstream:
        - payment-api
        - product-api
    runbooks:
      - title: Inventory API incident triage
        url: https://example.com/runbooks/inventory-api-triage
